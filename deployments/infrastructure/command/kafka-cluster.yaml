apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: command-queue
  namespace: kafka
spec:
  kafka:
    version: 3.9.0
    replicas: 3
    # KRaft config
    metadataVersion: 3.9-IV0 
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
      - name: tls
        port: 9093
        type: internal
        tls: true
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
      inter.broker.protocol.version: "3.9"
    storage:
      type: jbod
      volumes:
      - id: 0
        type: persistent-claim
        size: 100Gi
        deleteClaim: false
        class: premium-rwo
    template:
      pod:
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchExpressions:
                    - key: strimzi.io/name
                      operator: In
                      values:
                        - command-queue-cluster-kafka
                topologyKey: "kubernetes.io/hostname"
    resources:
      requests:
        cpu: "2"
        memory: 4Gi
      limits:
        cpu: "4"
        memory: 4Gi
  entityOperator:
    topicOperator: {}
    userOperator: {}
