apiVersion: apps/v1
kind: Deployment
metadata:
  name: command-server
  namespace: apps
spec:
  replicas: 2
  template:
    metadata:
      labels:
        app: command-producer
    spec:
      containers:
      - name: command-app
        image: github.com/ZestOfLife/scalable-live-summarizer-and-transcriber-app/query-server:latest
        env:
          - name: QUERY_PORT
            value: "8080"
          - name: REDIS_SERVER_ADDR
            value: "redis"
          - name: REDIS_SERVER_PORT
            value: "6379"
        # Readiness Probe
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: query-service
spec:
  selector:
    app: query-server
  ports:
    - name: htpp
      port: 8080
      targetPort: 8080
